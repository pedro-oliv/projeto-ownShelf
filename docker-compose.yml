services:
  nginx:
    image: nginx:latest
    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./back-end/nginx/conf/nginx.conf:/etc/nginx/nginx.conf

    depends_on:
      - front-end
      - user-service

  front-end:
    build: ./front-end/ownshelf-front
    container_name: front-end

    volumes:
      - ./front-end/ownshelf-front:/app
      - /app/node_modules

    ports:
      - "3000:3000"

  user-service:
    build: ./back-end/user-service
    container_name: user-service

    environment:
      DATABASE_URL: postgresql://postgres:123456@postgres:5432/user_service

    depends_on:
      - postgres

    volumes:
      - ./back-end/user-service:/app
      - /app/node_modules

    ports:
      - "3001:3001"

  postgres:
    image: postgres:16
    container_name: postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: user_service

    ports:
      - "5432:5432"